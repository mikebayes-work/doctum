# Rebuild the site every morning so deadlines, "closing soon" and closed
# banners stay current between scrapes. Needs a Netlify build hook URL saved
# as the repository secret NETLIFY_BUILD_HOOK (skips quietly if missing).
name: Daily rebuild

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "NETLIFY_BUILD_HOOK not set; skipping"; exit 0; fi
          curl -fsS -X POST -d '{}' "$HOOK"
