# Doctum - crawl the universities that refuse GitHub's servers, from Mike's PC.
#
# Runs on a self-hosted GitHub Actions runner on Mike's Windows PC (label: doctum-home).
# The PC isn't always on, and GitHub cancels a job that waits more than 24h for a runner, so the
# schedule fires three times a day: there is always a job waiting, it runs whenever the PC is awake,
# and the freshness check below skips it if the PC already crawled in the last 20 hours.
# It only crawls sources marked `runner: home` in scraper/sources.yaml and commits their raw files to
# data/raw-home/. The main workflow (phd-scrape.yml) builds the database from them.
# The main scrape ignores home files over 4 days old.
# It has its own concurrency group: sharing one with phd-scrape.yml made the main scrape wait up to
# 24h behind a home job that was waiting for a sleeping PC (Nov 2026).
#
# Setup (once): GitHub repo -> Settings -> Actions -> Runners -> New self-hosted runner -> Windows.
# Follow the commands it shows, add the label doctum-home when asked, and choose to run it as a service.
# The PC needs Git and Python 3.11+ installed for all users, and PowerShell scripts allowed
# (Set-ExecutionPolicy RemoteSigned -Scope LocalMachine). Chromium is installed by the workflow.
name: PhD scrape (home PC)

on:
  schedule:
    - cron: '37 7,13,19 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Only these source ids (space separated, blank = all home sources)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: phd-scrape-home   # own group: never blocks the main scrape (pushes retry with rebase instead)
  cancel-in-progress: false

jobs:
  scrape-home:
    runs-on: [self-hosted, doctum-home]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Skip if crawled recently
        id: fresh
        run: |
          $env:PYTHONUTF8 = "1"
          $recent = python -c "import json,glob,datetime as d`ntry:`n t=[d.datetime.fromisoformat(json.load(open(f,encoding='utf-8'))['scraped_at']) for f in glob.glob('data/raw-home/phdraw_*.json')]`n print(int(bool(t) and (d.datetime.now(d.timezone.utc)-max(t)).total_seconds() < 20*3600))`nexcept Exception:`n print(0)"
          if ($LASTEXITCODE -ne 0) { $recent = "0" }   # any problem with the check: crawl anyway
          if ("${{ github.event_name }}" -eq "schedule" -and $recent -eq "1") {
            Write-Output "Home crawl already done in the last 20 hours - skipping"
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Install
        if: steps.fresh.outputs.skip != 'true'
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m playwright install chromium   # browser for `browser: true` sources; cached after the first run

      - name: Crawl home sources
        if: steps.fresh.outputs.skip != 'true'
        env:
          CRAWLER_CONTACT: ${{ secrets.CRAWLER_CONTACT }}
          CRAWLER_JOBS: '4'
        run: python -m scraper.crawl --runner home ${{ github.event.inputs.sources }}

      - name: Commit raw files
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "doctum-bot"
          git config user.email "doctum-bot@users.noreply.github.com"
          git add data/raw-home
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Output "No changes"; exit 0 }
          git commit -m "Data: home PC crawl $(Get-Date -Format yyyy-MM-dd)"
          for ($i = 1; $i -le 5; $i++) {
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Output "Push failed, retrying ($i)"; Start-Sleep -Seconds (10 * $i)
          }
          exit 1
