# Doctum - crawl the universities that refuse GitHub's servers, from Mike's PC.
#
# Runs on a self-hosted GitHub Actions runner on Mike's Windows PC (label: doctum-home), Monday and
# Thursday evenings, so the results are in the repo before the Tuesday/Friday 05:23 UTC main scrape.
# It only crawls sources marked `runner: home` in scraper/sources.yaml and commits their raw files to
# data/raw-home/. The main workflow (phd-scrape.yml) builds the database from them.
# If the PC is off, the job waits in the queue; the main scrape ignores home files over 4 days old.
#
# Setup (once): GitHub repo -> Settings -> Actions -> Runners -> New self-hosted runner -> Windows.
# Follow the commands it shows, add the label doctum-home when asked, and choose to run it as a service.
# The PC needs Git and Python 3.11+ installed for all users, and PowerShell scripts allowed
# (Set-ExecutionPolicy RemoteSigned -Scope LocalMachine). Chromium is installed by the workflow.
name: PhD scrape (home PC)

on:
  schedule:
    - cron: '37 19 * * 1,4'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Only these source ids (space separated, blank = all home sources)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: phd-scrape   # never at the same time as the main scrape
  cancel-in-progress: false

jobs:
  scrape-home:
    runs-on: [self-hosted, doctum-home]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m playwright install chromium   # browser for `browser: true` sources; cached after the first run

      - name: Crawl home sources
        env:
          CRAWLER_CONTACT: ${{ secrets.CRAWLER_CONTACT }}
          CRAWLER_JOBS: '4'
        run: python -m scraper.crawl --runner home ${{ github.event.inputs.sources }}

      - name: Commit raw files
        run: |
          git config user.name "doctum-bot"
          git config user.email "doctum-bot@users.noreply.github.com"
          git add data/raw-home
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Output "No changes"; exit 0 }
          git commit -m "Data: home PC crawl $(Get-Date -Format yyyy-MM-dd)"
          for ($i = 1; $i -le 5; $i++) {
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Output "Push failed, retrying ($i)"; Start-Sleep -Seconds (10 * $i)
          }
          exit 1
