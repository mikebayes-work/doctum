# Doctum — Netlify config (pattern from The Grid).
#
# The build turns data/listings.json into a server-only JS module that is
# bundled INTO the edge functions. The database is never a URL: only the
# allowlisted public files and generated pages are copied into dist/.

[build]
  command = "node scripts/build.js"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "20"

# Belt and braces: data and source files 404 even if someone guesses the name.
[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/listings.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/phd.db"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scraper/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/sources.yaml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/_scrape_manifest.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Security headers live in dist/_headers, generated by scripts/build.js
# (so the CSP can include Google Analytics only when GA_ID is set).
